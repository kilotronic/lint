[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kilotronic-lint"
version = "1.2.0"
description = "The Python side of kilotronic/lint's pre-commit hooks: csv-lint, and yamllint and shfmt with default configurations."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kilotronic LLC" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kilotronic-csv-lint = "kilotronic_lint.csv_lint:main"
kilotronic-yamllint = "kilotronic_lint.tools:yamllint_main"
kilotronic-shfmt = "kilotronic_lint.tools:shfmt_main"

[tool.hatch.build.targets.wheel]
packages = ["src/kilotronic_lint"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
