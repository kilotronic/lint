name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Refuse the organisation's private terms (the DATA_LEAK_DENYLIST secret) in this event's commits:
  # added lines, file paths, commit messages and authors.
  data-leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: kilotronic/data-leak-check@f1da8a7ce76bfaabd70ea815d9417fb691e95799 # v1.1.0
        with:
          denylist: ${{ secrets.DATA_LEAK_DENYLIST }}

  # Secrets in this event's commits: gitleaks (anything shaped like a secret) and trufflehog (keys that still
  # work), from kilotronic/secret-scan.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: kilotronic/secret-scan@006556b813fd5054d7da8575d3928c5ad3583535 # v1.1.0

  # Real authors on this event's commits, in the owner's domains, from kilotronic/git-identity.
  git-identity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # allow-bots on a push asks which pull request a commit merged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: kilotronic/git-identity@76223f8d531904185d4bd46f66c65849cf0133f7 # v2.2.0
        with:
          domains: ixid.net, kilotronic.com
          allow-bots: dependabot

  # This repository's own files: nothing to find.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./

  # Each check must refuse what it is there to refuse. The bad files are made at run time, in a scratch
  # repository, so they are never in this repository's history.
  refuses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: action
      - name: Make a scratch repository with one finding for each check
        run: |
          mkdir scratch && cd scratch && git init -q
          mkdir -p .github/workflows
          # shellcheck disable=SC2016 # the $1 is meant literally: it is the finding
          printf '#!/bin/sh\necho $1\n' > unquoted                       # for the shellcheck step: SC2086, found by its shebang
          printf 'on: push\njobs:\n  a:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n' \
            > .github/workflows/w.yml                                    # for the pinned step: a tag, not a SHA
          printf 'FROM python:3.13-slim\n' > Dockerfile                   # for the pinned step: no digest
          printf 'on: push\njobs:\n  a:\n    runs-on: no-such-label\n    steps:\n      - run: echo hi\n' \
            > .github/workflows/labels.yml                               # for the actionlint step: unknown runner label
          git add -A
      - name: shellcheck refuses
        id: shellcheck
        continue-on-error: true
        working-directory: scratch
        run: |
          bash ../action/src/lint.sh install
          LINT_BIN="$RUNNER_TEMP/kilotronic-lint-sc0.11.0-al1.7.12" bash ../action/src/lint.sh shellcheck
      - name: actionlint refuses
        id: actionlint
        continue-on-error: true
        working-directory: scratch
        run: LINT_BIN="$RUNNER_TEMP/kilotronic-lint-sc0.11.0-al1.7.12" bash ../action/src/lint.sh actionlint
      - name: pinned refuses
        id: pinned
        continue-on-error: true
        working-directory: scratch
        run: bash ../action/src/lint.sh pinned
      - name: pinned accepts an explained exception and a build stage
        working-directory: scratch
        run: |
          printf 'FROM python:3.13-slim@sha256:%s AS base\nFROM base\n# unpinned-ok: digest set by the build command\nFROM ctx\n' \
            "$(printf '0%.0s' $(seq 64))" > Dockerfile
          printf 'on: push\njobs:\n  a:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: ./local\n      - uses: actions/checkout@%s\n' \
            "$(printf 'a%.0s' $(seq 40))" > .github/workflows/w.yml
          git add -A
          bash ../action/src/lint.sh pinned
      - name: Each check must have refused
        env:
          SHELLCHECK: ${{ steps.shellcheck.outcome }}
          ACTIONLINT: ${{ steps.actionlint.outcome }}
          PINNED: ${{ steps.pinned.outcome }}
        run: |
          echo "shellcheck=$SHELLCHECK actionlint=$ACTIONLINT pinned=$PINNED"
          test "$SHELLCHECK" = failure && test "$ACTIONLINT" = failure && test "$PINNED" = failure

  # The pre-commit/prek hooks, through prek try-repo: a clean sample passes, each check refuses its finding.
  prek-hooks:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@kilotronic.com
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@kilotronic.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: pip install prek==0.5.11
      - name: prek try-repo against sample files
        run: |
          hooks="$GITHUB_WORKSPACE"
          cd "$(mktemp -d)" && git init -q && mkdir -p .github/workflows
          # shellcheck disable=SC2016 # the $1 is meant literally
          printf '#!/bin/sh\necho "$1"\n' > ok.sh
          printf 'on: push\njobs:\n  a:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@%s\n' \
            "$(printf 'a%.0s' $(seq 40))" > .github/workflows/w.yml
          git add -A
          prek try-repo "$hooks" --all-files
          git commit -q -m clean
          for check in shellcheck actionlint pinned; do
            git reset -q --hard
            # shellcheck disable=SC2016 # the $1 is meant literally: it is the finding
            case $check in
              shellcheck) printf '#!/bin/sh\necho $1\n' > ok.sh ;;
              actionlint) sed -i 's/ubuntu-latest/no-such-label/' .github/workflows/w.yml ;;
              pinned) printf 'FROM python:3.13-slim\n' > Dockerfile ;;
            esac
            git add -A
            if prek try-repo "$hooks" "$check" --all-files; then echo "::error::$check did not refuse"; exit 1; fi
          done

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [dogfood, refuses, prek-hooks, secret-scan, git-identity, data-leak-check]
    if: always()
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do test "$r" = success; done
